wjf.obf.kind.generic=Общая
wjf.h.invisible=Невидимые символы в идентификаторах
wjf.h.invisible.loc=идентификаторов: %d
wjf.h.invisible.why=Идентификаторы содержат невидимые символы: разные классы могут выглядеть одинаково на экране.
wjf.h.strenc=Строковые константы зашифрованы
wjf.h.strenc.loc=признаков: %d
wjf.h.strenc.why=Строки расшифровываются при запуске, поэтому обычный поиск текста по архиву их не обнаружит.
wjf.h.marker=Признак обфускатора: %s
wjf.h.marker.why=Строка-маркер, оставленная %s.
wjf.h.incomplete=Анализ неполный — прочитаны не все классы
wjf.h.incomplete.why=Ограничение времени или размера остановило проверку. Чистый результат не охватывает весь архив.
wjf.h.native=Нативная библиотека в архиве
wjf.h.native.why=JAR содержит нативный код, который выполняется за пределами JVM и не виден анализу байткода.
wjf.h.script=Исполняемый файл или скрипт в архиве
wjf.h.script.why=Для модов JAR исполняемые скрипты обычно не требуются.
wjf.h.entropy=Непрозрачный ресурс с высокой энтропией
wjf.h.entropy.why=%.2f бит/байт в %s — возможны зашифрованные данные или обычное сжатие.
wjf.h.agent=Объявлен Java-агент
wjf.h.agent.why=Premain/Agent-Class позволяет JAR изменять байткод классов, загружаемых JVM.
wjf.h.tweak=Объявлен модуль LaunchWrapper
wjf.h.tweak.why=TweakClass запускается до игры и может изменять её код. Его используют и обычные загрузчики модов, и чит-инжекторы.
wjf.h.coremod=Объявлен FML coremod
wjf.h.coremod.why=Coremod загружается до игры и может изменять любой класс.
wjf.h.nestedSkip=Вложенный JAR не открыт (достигнут предел глубины)
wjf.h.nestedSkip.why=Увеличьте допустимую глубину вложенности в настройках.
