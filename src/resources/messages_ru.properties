wjf.h.encrypted=В архиве есть защищённые паролем элементы
wjf.h.encrypted.loc=элементов: %d
wjf.h.encrypted.why=Зашифрованные элементы нельзя декомпилировать и проверить. Такой архив скрывает содержимое от анализа.
wjf.h.duplicate=Повторяющиеся имена элементов архива
wjf.h.duplicate.loc=имён: %d
wjf.h.duplicate.why=Два элемента имеют один путь (например, %s). Декомпилятор и JVM могут использовать разные копии, что позволяет скрывать код.
wjf.h.traversal=Выход за пределы папки в имени элемента
wjf.h.traversal.why=При извлечении элемент может быть записан за пределами целевой папки (Zip Slip).
wjf.h.method=Нестандартный метод сжатия
wjf.h.method.why=В JAR обычно используется хранение без сжатия или deflate. Другие методы могут не читаться стандартными средствами и указывать на шифрование AES.
wjf.h.prefix=Данные перед началом архива
wjf.h.prefix.why=Перед первым заголовком ZIP есть дополнительные байты. Для самораспаковывающегося EXE это нормально, для JAR мода — необычно.
wjf.h.trailing=Данные после конца архива
wjf.h.trailing.why=Байты после записи конца каталога ZIP могут скрывать данные, не видимые стандартным архиваторам.
wjf.h.nonascii=Не-ASCII символы в именах элементов
wjf.h.nonascii.why=Похожие символы Unicode и невидимые знаки в именах классов могут мешать поиску по имени.
wjf.h.anomaly=Аномалия архива
wjf.h.unreadable=Структура архива не читается
wjf.h.unreadable.why=Не удалось разобрать каталог ZIP, поэтому содержимое архива неизвестно.
wjf.h.fail.tooSmall=файл слишком мал для ZIP (%d байт)
wjf.h.fail.noEocd=не найдена запись конца каталога ZIP
wjf.h.fail.cdRange=каталог ZIP указывает за пределы файла
wjf.h.anom.cdRange=Смещение или размер каталога вне файла (смещение=%d, размер=%d, файл=%d)
wjf.h.anom.pastEnd=Элемент указывает за конец файла: %s
wjf.h.anom.ratio=Чрезмерная степень сжатия (%d:1): %s
wjf.h.anom.count=Каталог заявляет %d элементов; разобрать удалось %d
wjf.h.badclass=Классы с нечитаемой структурой
wjf.h.badclass.why=Не удалось разобрать таблицу констант этих классов. Их структура может быть повреждена или намеренно изменена.
